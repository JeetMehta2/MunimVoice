[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "munim"
version = "0.1.0"
description = "Munim: Voice-First AI Business Partner for Small Indian Merchants on Paytm"
readme = "README.md"
requires-python = ">=3.11, <3.12"
authors = [
    { name = "Munim Engineering Team", email = "dev@munim.ai" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlmodel>=0.0.16",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "apscheduler>=3.10.4",
    "edge-tts>=6.1.12",
    "google-genai>=0.1.1",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pytest>=8.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0"
]
