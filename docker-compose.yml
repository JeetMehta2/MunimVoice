version: '3.8'

services:
  munim-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: munim-fullstack
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_URL=sqlite:///data/munim.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
